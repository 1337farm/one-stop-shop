name: automerge

# Enables squash auto-merge on same-repo PRs (never forks): once all required
# checks pass, the PR merges itself. Draft PRs are skipped (API rejects them).
# The repo allows squash merges only, so the method is fixed regardless.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto:
    name: auto
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: write
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable pull request automerge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
