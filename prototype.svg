<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#120524" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07040d" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff44ec"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3759"/>
      <stop offset="100%" stop-color="#1b1829"/>
    </linearGradient>
  </defs>

  <!-- Background Space Canvas -->
  <rect width="1280" height="720" fill="url(#spaceGlow)"/>

  <!-- Subtle Perspective Grid Lines -->
  <g stroke="#351f5c" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="0" y1="660" x2="1280" y2="660"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Flow Titles -->
  <text x="235" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">LAUNCH &amp; SETUP</text>
  <text x="640" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">ENVIRONMENT BOOT</text>
  <text x="1045" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">UNIFIED WORKSPACE</text>

  <!-- ==================== SCREEN 1: LAUNCH & SETUP ==================== -->
  <g transform="translate(95, 75)">
    <!-- Chassis -->
    <rect width="280" height="580" rx="36" fill="#0c0a14" stroke="url(#phoneBorder)" stroke-width="4"/>
    <!-- Screen Area -->
    <rect x="8" y="8" width="264" height="564" rx="28" fill="#08060f"/>
    <!-- Punch Hole Camera -->
    <circle cx="140" cy="22" r="5" fill="#000000"/>

    <!-- Status Bar -->
    <text x="24" y="26" fill="#8d89a5" font-family="monospace" font-size="11">9:41</text>
    <path d="M 235 20 L 245 20 L 240 13 Z" fill="#8d89a5"/>
    <rect x="248" y="16" width="10" height="6" rx="1" fill="#8d89a5"/>

    <!-- Centered OSS Monogram -->
    <g transform="translate(140, 240)" filter="url(#neonGlow)">
      <!-- Outer Hexagonal Frame -->
      <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="#ff2df5" stroke-width="4"/>
      <!-- Inner OSS Glyphs -->
      <text x="0" y="14" fill="#ffffff" stroke="#ff2df5" stroke-width="1.5" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle">OSS</text>
    </g>

    <!-- Main Branding -->
    <text x="140" y="340" fill="#ffffff" filter="url(#neonGlow)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" text-anchor="middle">OneStopShop</text>
    <text x="140" y="365" fill="#a49ebc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">Standalone ARM64 Linux Engine</text>

    <!-- Install Button -->
    <g transform="translate(32, 450)">
      <rect width="216" height="48" rx="14" fill="#140624" stroke="#ff2df5" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <text x="108" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">INSTALL NOW</text>
    </g>

    <!-- Android Nav Bar -->
    <circle cx="140" cy="545" r="5" fill="#4d4765"/>
    <rect x="70" y="542" width="10" height="6" rx="1" fill="#4d4765"/>
    <polygon points="210,540 210,550 202,545" fill="#4d4765"/>
  </g>

  <!-- ==================== SCREEN 2: ENVIRONMENT BOOT ==================== -->
  <g transform="translate(500, 75)">
    <!-- Chassis -->
    <rect width="280" height="580" rx="36" fill="#0c0a14" stroke="url(#phoneBorder)" stroke-width="4"/>
    <!-- Screen Area -->
    <rect x="8" y="8" width="264" height="564" rx="28" fill="#08060f"/>
    <!-- Punch Hole Camera -->
    <circle cx="140" cy="22" r="5" fill="#000000"/>

    <!-- Status Bar -->
    <text x="24" y="26" fill="#8d89a5" font-family="monospace" font-size="11">9:41</text>
    <path d="M 235 20 L 245 20 L 240 13 Z" fill="#8d89a5"/>
    <rect x="248" y="16" width="10" height="6" rx="1" fill="#8d89a5"/>

    <!-- Header Branding -->
    <text x="140" y="90" fill="#ffffff" filter="url(#subtleGlow)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" text-anchor="middle">OneStopShop</text>
    <text x="140" y="112" fill="#d500f9" font-family="monospace" font-size="11" letter-spacing="1.5" text-anchor="middle">OSS CORE INIT</text>

    <!-- Isometric Tesseract & Arc Progress -->
    <g transform="translate(140, 240)">
      <!-- Progress Arc Ring (75% Complete) -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#25163b" stroke-width="5"/>
      <path d="M 0 -76 A 76 76 0 1 1 -68 34" fill="none" stroke="#ff2df5" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>

      <!-- Inner Wireframe Tesseract -->
      <g stroke="#ff6bf8" stroke-width="1.8" fill="none" filter="url(#subtleGlow)">
        <!-- Outer Box -->
        <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18"/>
        <line x1="0" y1="-36" x2="0" y2="0"/>
        <line x1="32" y1="18" x2="0" y2="0"/>
        <line x1="-32" y1="18" x2="0" y2="0"/>
        <!-- Inner Box -->
        <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" stroke="#ffffff"/>
        <!-- Interconnecting Rays -->
        <line x1="0" y1="-36" x2="0" y2="-18" stroke="#ffffff"/>
        <line x1="32" y1="-18" x2="16" y2="-9" stroke="#ffffff"/>
        <line x1="32" y1="18" x2="16" y2="9" stroke="#ffffff"/>
        <line x1="0" y1="36" x2="0" y2="18" stroke="#ffffff"/>
        <line x1="-32" y1="18" x2="-16" y2="9" stroke="#ffffff"/>
        <line x1="-32" y1="-18" x2="-16" y2="-9" stroke="#ffffff"/>
      </g>
    </g>

    <!-- Progress Status Stream -->
    <g transform="translate(30, 390)">
      <text x="0" y="0" fill="#a49ebc" font-family="'JetBrains Mono', monospace" font-size="11">Unpacking rootfs: <tspan fill="#39ff14">DONE</tspan></text>
      <text x="0" y="24" fill="#a49ebc" font-family="'JetBrains Mono', monospace" font-size="11">Configuring PRoot layer...</text>
      <text x="0" y="48" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="11">&gt; Spawning oss-daemon...</text>
      <text x="0" y="72" fill="#585274" font-family="'JetBrains Mono', monospace" font-size="11">Listening: 127.0.0.1:8080</text>
    </g>

    <!-- Android Nav Bar -->
    <circle cx="140" cy="545" r="5" fill="#4d4765"/>
    <rect x="70" y="542" width="10" height="6" rx="1" fill="#4d4765"/>
    <polygon points="210,540 210,550 202,545" fill="#4d4765"/>
  </g>

  <!-- ==================== SCREEN 3: UNIFIED WORKSPACE ==================== -->
  <g transform="translate(905, 75)">
    <!-- Chassis -->
    <rect width="280" height="580" rx="36" fill="#0c0a14" stroke="url(#phoneBorder)" stroke-width="4"/>
    <!-- Screen Area -->
    <rect x="8" y="8" width="264" height="564" rx="28" fill="#08060f"/>
    <!-- Punch Hole Camera -->
    <circle cx="140" cy="22" r="5" fill="#000000"/>

    <!-- Status Bar -->
    <text x="24" y="26" fill="#8d89a5" font-family="monospace" font-size="11">9:41</text>
    <path d="M 235 20 L 245 20 L 240 13 Z" fill="#8d89a5"/>
    <rect x="248" y="16" width="10" height="6" rx="1" fill="#8d89a5"/>

    <!-- Top App Bar (Workspace Header) -->
    <text x="20" y="60" fill="#ffffff" filter="url(#subtleGlow)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">OneStopShop</text>

    <!-- Local Daemon Status Badge (No profile picture/online tag) -->
    <g transform="translate(180, 48)">
      <rect width="76" height="18" rx="9" fill="#130a24" stroke="#39ff14" stroke-width="1"/>
      <circle cx="10" cy="9" r="3.5" fill="#39ff14"/>
      <text x="18" y="12.5" fill="#39ff14" font-family="monospace" font-size="8.5" font-weight="700">LOCAL ACT</text>
    </g>

    <!-- Workspace Tabs -->
    <g transform="translate(16, 75)">
      <rect width="232" height="24" rx="6" fill="#140f24"/>
      <!-- Active Tab -->
      <rect x="2" y="2" width="76" height="20" rx="4" fill="#ff2df5" opacity="0.3"/>
      <text x="40" y="16" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">TERMINAL</text>
      <!-- Inactive Tabs -->
      <text x="116" y="16" fill="#8b85a6" font-family="monospace" font-size="10" text-anchor="middle">EDITOR</text>
      <text x="192" y="16" fill="#8b85a6" font-family="monospace" font-size="10" text-anchor="middle">KANBAN</text>
    </g>

    <!-- High-Density Terminal Window -->
    <g transform="translate(16, 108)">
      <rect width="232" height="100" rx="8" fill="#040208" stroke="#2c2045" stroke-width="1.2"/>
      <text x="10" y="18" fill="#39ff14" font-family="'JetBrains Mono', monospace" font-size="9.5">oss@localhost:~$</text>
      <text x="110" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">rg "Tool" ./src</text>
      <text x="10" y="34" fill="#a49ebc" font-family="'JetBrains Mono', monospace" font-size="9">src/agent.rs: #[derive(Tool)]</text>
      <text x="10" y="50" fill="#39ff14" font-family="'JetBrains Mono', monospace" font-size="9.5">oss@localhost:~$</text>
      <text x="110" y="50" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">oss-agent run</text>
      <text x="10" y="66" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="9">[daemon] Task #14 ingesting...</text>
      <text x="10" y="82" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="9">[daemon] AST diff ready</text>
    </g>

    <!-- Code Editor Area -->
    <g transform="translate(16, 218)">
      <text x="0" y="14" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="10.5">pub struct <tspan fill="#ffffff">WorkspaceState</tspan> {</text>
      <text x="12" y="32" fill="#8d89a5" font-family="'JetBrains Mono', monospace" font-size="10.5">pub task: <tspan fill="#39ff14">TaskId</tspan>,</text>
      <text x="12" y="50" fill="#8d89a5" font-family="'JetBrains Mono', monospace" font-size="10.5">pub mode: <tspan fill="#39ff14">Runtime::Local</tspan>,</text>
      <text x="12" y="68" fill="#8d89a5" font-family="'JetBrains Mono', monospace" font-size="10.5">pub daemon_pid: <tspan fill="#ff6bf8">u32</tspan>,</text>
      <text x="0" y="86" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="10.5">}</text>
      <text x="0" y="112" fill="#ff44ec" font-family="'JetBrains Mono', monospace" font-size="10.5">impl <tspan fill="#ffffff">WorkspaceState</tspan> { ... }</text>
    </g>

    <!-- Floating AI Agent & System Telemetry HUD -->
    <g transform="translate(125, 375)" filter="url(#subtleGlow)">
      <rect width="123" height="135" rx="12" fill="#130922" stroke="#ff2df5" stroke-width="1.8" opacity="0.95"/>
      <text x="12" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="1">AI AGENT HUD</text>

      <!-- CPU Metric -->
      <text x="12" y="42" fill="#a49ebc" font-family="monospace" font-size="9.5">CPU</text>
      <text x="96" y="42" fill="#39ff14" font-family="monospace" font-size="9.5">14%</text>
      <!-- Sparkline Graph 1 -->
      <path d="M 12 56 L 36 56 L 44 48 L 52 58 L 68 56 L 76 50 L 92 56 L 111 56" fill="none" stroke="#ff44ec" stroke-width="1.5"/>

      <!-- RAM Metric -->
      <text x="12" y="78" fill="#a49ebc" font-family="monospace" font-size="9.5">RAM</text>
      <text x="82" y="78" fill="#39ff14" font-family="monospace" font-size="9.5">1.1 GB</text>
      <!-- Sparkline Graph 2 -->
      <path d="M 12 92 C 30 86, 50 98, 70 90 C 90 84, 100 94, 111 92" fill="none" stroke="#39ff14" stroke-width="1.5"/>

      <!-- Engine Badge -->
      <rect x="12" y="106" width="99" height="18" rx="4" fill="#25123d"/>
      <text x="61" y="118.5" fill="#ff6bf8" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">aarch64-musl</text>
    </g>

    <!-- Android Nav Bar -->
    <circle cx="140" cy="545" r="5" fill="#4d4765"/>
    <rect x="70" y="542" width="10" height="6" rx="1" fill="#4d4765"/>
    <polygon points="210,540 210,550 202,545" fill="#4d4765"/>
  </g>
</svg>
