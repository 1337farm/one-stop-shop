[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
rig-core = "0.4.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.21"
futures-util = "0.3"
thiserror = "2.0.20"
wasmi = "0.36.0"
wat = "1.0.83"
base64 = "0.22.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio-rusqlite = "0.6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4.45"
schemars = "0.8.22"
